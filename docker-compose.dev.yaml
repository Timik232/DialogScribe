services:
  dialogscribe:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dialogscribe-dev
    ports:
      - "7860:7860"
    environment:
      # Transcription via Mistral Voxtral
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - ASR_URL=https://api.mistral.ai
      - ASR_MODEL=voxtral-mini-latest
      # LLM for summary / insights / chat (Mistral OpenAI-compat)
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=https://api.mistral.ai/v1
      - LLM_MODEL=mistral-small-latest
      # Auth — dev-only secrets MUST come from the operator's environment
      # (.env.dev, gitignored). No committed defaults: compose refuses to
      # start without explicit values.
      - ENVIRONMENT=development
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env.dev (dev-only value, >=32 chars)}
      - API_KEY=${API_KEY:-}
      - V1_API_ENABLED=${V1_API_ENABLED:-false}
      # Database (SQLite inside container)
      - DATABASE_URL=sqlite+aiosqlite:////app/data/dialogscribe.db
      # Server
      - HOST=0.0.0.0
      - PORT=7860
      - MAX_UPLOAD_SIZE_MB=500
      # Bootstrap admin (dev-only credentials from operator env, no defaults)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.dev (dev-only value)}
      # Frontend origin (CoPilot Sales dev server)
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - dialogscribe_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dialogscribe_data:
