services:
  dialogscribe:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dialogscribe-dev
    ports:
      - "7860:7860"
    env_file:
      - .env.dev
    environment:
      # Transcription via GigaAM (LiteLLM proxy)
      - LITELLM_URL=https://litellm.komolov.synology.me
      - LITELLM_MODEL=gigaamv3-generation
      # LLM for summary / insights / chat (GigaChat)
      # GIGACHAT_API_KEY is injected from .env.dev (gitignored — keep secrets out of VCS)
      - GIGACHAT_SCOPE=GIGACHAT_API_CORP
      - GIGACHAT_MODEL=GigaChat-Pro
      # Database (SQLite inside container)
      - DATABASE_URL=sqlite+aiosqlite:////app/data/dialogscribe.db
      # Server
      - HOST=0.0.0.0
      - PORT=7860
      - MAX_UPLOAD_SIZE_MB=500
      # Bootstrap admin
      - ADMIN_EMAIL=admin@local.dev
      - ADMIN_PASSWORD=admin123
      # Frontend origin (CoPilot Sales dev server)
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - dialogscribe_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dialogscribe_data:
